name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codex-hook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
      - run: python -m unittest discover -s integrations/codex -v

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets
      - name: Build Windows bridge executable
        if: runner.os == 'Windows'
        run: cargo build --locked --release
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: clipaste-windows
          path: target/release/clipaste.exe

  linux-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install isolated desktop test dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb xclip sway wl-clipboard dbus-x11 python3-pil
      - name: Exercise real X11 and Wayland selections
        run: bash tests/linux/run.sh
